<!DOCTYPE html>
<html>
<head>
  <!--

  <!--
    Add your reCAPTCHA v3 site key below. This exposes a global helper
    function `executeRecaptcha(action)` which returns a Promise resolving
    to the token. Replace YOUR_SITE_KEY with your site key.
  -->
    <script src="https://www.google.com/recaptcha/api.js?render=6Lc47yQsAAAAAEco52pAL5B032ZK2vrPn2BYx-ZN"></script>
  <script>
    // Robust helper: waits for grecaptcha to be ready before executing.
    // Site key used by this page:
    const RECAPTCHA_SITE_KEY = '6Lc47yQsAAAAAEco52pAL5B032ZK2vrPn2BYx-ZN';
    console.log('[recaptcha] site key (in page):', RECAPTCHA_SITE_KEY);
    // Log which recaptcha script is present on the page (if any)
    const recScript = document.querySelector('script[src*="recaptcha"]');
    console.log('[recaptcha] recaptcha script element:', recScript ? recScript.src : 'none');

    // Replace YOUR_SITE_KEY with your actual site key.
    globalThis.executeRecaptcha = function(action) {
      console.log('[recaptcha] executeRecaptcha called, action=', action, 'grecaptcha present=', !!globalThis.grecaptcha);
      return new Promise(function(resolve, reject) {
        try {
          if (!globalThis.grecaptcha) {
            // grecaptcha script not loaded
            resolve(null);
            return;
          }
          globalThis.grecaptcha.ready(function() {
            try {
                console.log('[recaptcha] calling grecaptcha.execute with site key:', RECAPTCHA_SITE_KEY);
                globalThis.grecaptcha.execute(RECAPTCHA_SITE_KEY, { action: action })
                  .then(function(token) { console.log('[recaptcha] grecaptcha returned token?', !!token); resolve(token); })
                  .catch(function(err) { console.error('[recaptcha] grecaptcha.execute error', err); reject(err); });
            } catch (e) {
              reject(e);
            }
          });
        } catch (e) {
          reject(e);
        }
      });
    };
  </script>
</head>
<body>

</body>
